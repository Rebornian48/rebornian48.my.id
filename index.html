<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rebornian48 — Tools & Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f2ec; --surface: #fff; --border: #e6dfce; --border-strong: #14213d;
      --text: #14213d; --muted: #6b6a5e; --accent: #ff3b6b;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1220; --surface: #16203a; --border: #263356; --border-strong: #0b1220;
              --text: #eef2fb; --muted: #8a97b3; --accent: #ff5c85; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh;
      display: grid; place-items: center;
      padding: 32px;
      line-height: 1.5;
    }
    .wrap { max-width: 720px; width: 100%; text-align: center; }
    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 8px 14px 8px 10px;
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: 999px; box-shadow: 3px 3px 0 var(--border-strong);
      font-weight: 800; letter-spacing: -0.02em;
    }
    .brand span {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, #a77bff, #ff3b6b); color: #fff;
      display: grid; place-items: center; font-size: 14px;
    }
    h1 {
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 800; letter-spacing: -0.035em;
      line-height: 1.05;
      margin: 24px 0 12px;
    }
    h1 em { font-style: normal; color: var(--accent); }
    p.lead { color: var(--muted); margin: 0 0 32px; font-size: 16px; }
    .tools {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px; text-align: left;
    }
    .tool {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 18px;
      text-decoration: none;
      color: var(--text);
      box-shadow: 4px 4px 0 var(--border-strong);
      transition: transform .1s, box-shadow .1s;
      display: flex; flex-direction: column; gap: 6px;
    }
    .tool:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--border-strong); }
    .tool b { font-size: 16px; font-weight: 700; }
    .tool em { font-style: normal; font-size: 12px; color: var(--muted); }
    .tool span {
      margin-top: 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em;
      color: var(--accent); text-transform: uppercase;
    }
    footer { margin-top: 40px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><span>⚡</span> rebornian48</div>
    <h1>Kumpulan tools <em>gratis</em> buat harian.</h1>
    <p class="lead">Mini-apps yang di-host di satu tempat. Tanpa login, ringan, terbuka.</p>

    <div class="tools">
      <a class="tool" href="/waktukita/">
        <b>waktukita</b>
        <em>Jam lokal · cuaca · jadwal adzan · peta lokasi</em>
        <span>Buka →</span>
      </a>
      <a class="tool" href="/choropleth/">
        <b>choropleth</b>
        <em>Peta 38 provinsi · upload CSV/Excel · neraca produksi · ekspor SVG/PNG</em>
        <span>Buka →</span>
      </a>
    </div>

    <footer>© <span id="y"></span> rebornian48.my.id</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
